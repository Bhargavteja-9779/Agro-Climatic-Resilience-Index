<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate-Aware Crop Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ECC71;
            --secondary: #27AE60;
            --bg: #0F172A;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #F8FAFC;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1E293B, var(--bg));
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            background: linear-gradient(135deg, #10B981, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #94A3B8;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .results.show {
            opacity: 1;
        }

        .metric-card {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .risk-High { color: #EF4444; }
        .risk-Medium { color: #F59E0B; }
        .risk-Low { color: #10B981; }

        .xai-section {
            margin-top: 2rem;
        }

        .xai-img {
            width: 100%;
            border-radius: 12px;
            margin-top: 1rem;
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .xai-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Form -->
        <div class="card">
            <h1>Predict Yield & Risk</h1>
            <p style="color: #94A3B8; margin-bottom: 2rem;">Decision Support System for Farmers</p>
            
            <form id="predictForm">
                <div class="form-group">
                    <label>State</label>
                    <select id="state" required>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>District</label>
                    <input type="text" id="district" value="COIMBATORE" placeholder="e.g. COIMBATORE" required>
                </div>

                <div class="form-group">
                    <label>Crop Type</label>
                    <select id="crop" required>
                        <option value="rice">Rice</option>
                        <option value="maize">Maize</option>
                        <option value="cotton">Cotton</option>
                        <option value="chickpea">Chickpea</option>
                        <option value="pigeonpeas">Pigeonpeas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Season</label>
                    <select id="season" required>
                        <option value="Kharif">Kharif</option>
                        <option value="Rabi">Rabi</option>
                        <option value="Whole Year">Whole Year</option>
                    </select>
                </div>

                <details style="margin-bottom: 1.5rem;">
                    <summary style="cursor: pointer; color: var(--primary); font-weight: 600;">Advanced Soil/Weather Params 👇</summary>
                    <div style="margin-top: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <input type="number" id="area" placeholder="Area (Hectares)" value="1000" required>
                        <input type="number" id="rainfall" placeholder="Annual Rainfall (mm)" value="800" required>
                        <input type="number" id="n" placeholder="Nitrogen (N)" value="90">
                        <input type="number" id="p" placeholder="Phosphorus (P)" value="40">
                        <input type="number" id="k" placeholder="Potassium (K)" value="40">
                        <input type="number" id="temp" placeholder="Temp (°C)" value="28">
                    </div>
                </details>

                <button type="submit">
                    <span id="btnText">Generate Prediction</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>
        </div>

        <!-- Output Results -->
        <div class="card results" id="resultsSection">
            <h2 style="margin-top:0;">Analysis Results</h2>
            
            <div class="metric-card">
                <div>
                    <label>Predicted Yield</label>
                    <div class="metric-value" style="color: #3B82F6;">
                        <span id="yieldValue">--</span> <span style="font-size: 1rem;">Tons/Hectare</span>
                    </div>
                </div>
            </div>

            <div class="metric-card">
                <div>
                    <label>Climate Risk Score</label>
                    <div class="metric-value" id="riskValue">--</div>
                </div>
            </div>

            <div class="xai-section">
                <h3>Explainable AI (SHAP)</h3>
                <p style="color: #94A3B8; font-size: 0.9rem;">Global feature contribution illustrating how soil and weather impact the model's yield decisions across South India.</p>
                <img src="http://127.0.0.1:8000/visualizations/shap_summary.png" alt="SHAP Summary Plot" class="xai-img">
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const results = document.getElementById('resultsSection');
            
            btnText.style.display = 'none';
            loader.style.display = 'block';

            const payload = {
                State: document.getElementById('state').value,
                District: document.getElementById('district').value,
                Crop: document.getElementById('crop').value,
                Season: document.getElementById('season').value,
                Area: parseFloat(document.getElementById('area').value),
                Annual_Rainfall: parseFloat(document.getElementById('rainfall').value),
                N: parseFloat(document.getElementById('n').value),
                P: parseFloat(document.getElementById('p').value),
                K: parseFloat(document.getElementById('k').value),
                temperature: parseFloat(document.getElementById('temp').value),
                humidity: 60.0, // defaults for UI brevity
                ph: 6.5,
                Fertilizer: 5000, 
                Pesticide: 200,
                Rainfall_Required: 800
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    document.getElementById('yieldValue').textContent = data.predicted_yield_tons_per_hectare;
                    const riskEl = document.getElementById('riskValue');
                    riskEl.textContent = data.risk_score;
                    riskEl.className = `metric-value risk-${data.risk_score}`;
                    
                    results.classList.add('show');
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                alert("Failed to connect to backend backend. Ensure API is running on port 8000.");
            } finally {
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
